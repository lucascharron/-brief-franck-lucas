<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fleurs Roussel</title>
  <link rel="stylesheet" href="dist/output.css">
  <!-- defer : le script s'exécute une fois la page lue -->
  <script src="js/app.js" defer></script>
</head>
<body class="bg-white text-roussel-texte">

  <!-- En-tête commun du site -->
  <header class="bg-roussel-vert text-white">
    <div class="mx-auto flex max-w-5xl flex-col gap-3 px-4 py-4 md:flex-row md:items-center md:justify-between">
      <a href="index.html" class="text-xl font-bold focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white">Fleurs Roussel</a>
      <nav aria-label="Navigation principale">
        <ul class="flex flex-wrap gap-x-5 gap-y-2">
          <li><a href="bouquets.html" class="hover:underline focus-visible:outline-2 focus-visible:outline-white">Bouquets</a></li>
          <li><a href="abonnement.html" class="hover:underline focus-visible:outline-2 focus-visible:outline-white">Abonnement</a></li>
          <li><a href="contact.html" class="hover:underline focus-visible:outline-2 focus-visible:outline-white">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="contenu" class="mx-auto max-w-5xl px-4 py-8">
      <h1 class="text-2xl font-bold text-center mb-6 text-zinc-800">Quelle fleur êtes-vous ?</h1>

      <form id="quiz-form" class="space-y-6">
        <div id="questions-container" class="space-y-6">
          <!-- Chargé dynamiquement depuis questions.json -->
        </div>

        <div id="error-message" class="text-red-600 text-sm font-medium min-h-[1.25rem]" aria-live="polite"></div>

        <button type="submit" id="submit-btn" class="w-full bg-emerald-600 text-white font-medium py-3 px-4 rounded-lg hover:bg-emerald-700 transition-colors cursor-pointer">
          Découvrir mon profil
        </button>
      </form>

      <section id="result-container" class="hidden mt-6 p-6 bg-emerald-50 border border-emerald-200 rounded-lg space-y-3" aria-live="polite">
        <!-- Résultat injecté ici -->
      </section>

      <button id="reset-btn" class="hidden w-full mt-4 bg-zinc-200 text-zinc-800 font-medium py-3 px-4 rounded-lg hover:bg-zinc-300 transition-colors cursor-pointer">
        Recommencer
      </button>
    </main>

    <script src="js/app.js"></script>

  <!-- Pied de page commun du site -->
  <footer class="mt-12 bg-roussel-vert-clair">
    <div class="mx-auto max-w-5xl px-4 py-6 text-roussel-gris">
      <p><strong class="text-roussel-vert">Fleurs Roussel</strong>, 14 rue Colbert, 37000 Tours</p>
    </div>
  </footer>

</body>
</html>
